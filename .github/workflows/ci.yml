name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: vo
          POSTGRES_PASSWORD: vo_local_dev_only
          POSTGRES_DB: virtual_office
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vo -d virtual_office"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://vo:vo_local_dev_only@localhost:5432/virtual_office
      WEB_ORIGIN: http://localhost:3100
      BETTER_AUTH_URL: http://localhost:4000
      # CI-only. Real secrets live in the deployment environment, never here.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-any-real-environment
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lifecycle scripts are blocked by default (CLAUDE.md §35); the
      # allowlist in package.json is what CI honours too.
      - run: pnpm --filter @vo/server db:migrate

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm verify

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
